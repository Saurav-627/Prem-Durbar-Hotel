<!-- GLOBAL SEARCH MODAL -->
<div x-show="searchOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4" style="display: none;">
    <div x-show="searchOpen" @click="searchOpen = false" class="fixed inset-0 bg-black/80 backdrop-blur-sm"></div>
    <div x-show="searchOpen" 
         x-transition:enter="transition ease-out duration-300 transform"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-200 transform"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         class="relative w-full max-w-2xl rounded-2xl p-6 border shadow-2xl animate__animated animate__zoomIn"
         :class="{
             'bg-white border-gray-200 text-gray-800': currentTheme === 'light',
             'bg-[#1A3A32] border-brand-primary/30 text-white': currentTheme !== 'light'
         }">
        <div class="flex items-center justify-between pb-4 border-b border-brand-primary/10">
            <h3 class="font-luxury-title text-xl font-medium tracking-wide">{{ hotel_settings.search_modal_title|default:"Search Resort" }}</h3>
            <button @click="searchOpen = false" class="p-2 rounded-lg hover:bg-brand-primary/10">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <form action="{% url 'rooms:room_list' %}" method="GET" class="mt-6 flex gap-3">
            <input type="text" name="category" placeholder="{{ hotel_settings.search_modal_placeholder|default:'Search room categories, dining, amenities...' }}" 
                   class="flex-1 px-4 py-3 rounded-lg border focus:outline-none focus:ring-1 focus:ring-brand-primaryLight bg-transparent text-inherit"
                   :class="{ 'border-gray-300': currentTheme === 'light', 'border-brand-primary/40': currentTheme !== 'light' }">
            <button type="submit" class="btn-gold-gradient px-6 py-3 rounded-lg font-bold text-sm uppercase tracking-wider text-white shadow-md">
                {{ hotel_settings.search_modal_button_text|default:"Search" }}
            </button>
        </form>
    </div>
</div>
