<!-- MOBILE SIDE MENU -->
<div x-show="mobileMenuOpen" class="fixed inset-0 z-50 flex md:hidden" style="display: none;">
    <!-- Backdrop -->
    <div x-show="mobileMenuOpen" 
         x-transition:enter="transition-opacity ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="mobileMenuOpen = false" 
         class="fixed inset-0 bg-black/60 backdrop-blur-sm"></div>

    <!-- Sidebar Panel -->
    <div x-show="mobileMenuOpen"
         x-transition:enter="transition ease-in-out duration-300 transform"
         x-transition:enter-start="translate-x-full"
         x-transition:enter-end="translate-x-0"
         x-transition:leave="transition ease-in-out duration-200 transform"
         x-transition:leave-start="translate-x-0"
         x-transition:leave-end="translate-x-full"
         class="relative ml-auto flex h-full w-full max-w-xs flex-col overflow-y-auto py-4 pb-12 shadow-xl border-l"
         :class="{
             'bg-white border-gray-200 text-gray-800': currentTheme === 'light',
             'bg-[#0A2017] border-brand-primary/30 text-white': currentTheme !== 'light'
         }">
        <div class="flex items-center justify-between px-4 pb-6 border-b" :class="{ 'border-gray-200': currentTheme === 'light', 'border-brand-primary/20': currentTheme !== 'light' }">
            <span class="font-luxury-title text-xl font-bold tracking-wider">Navigation</span>
            <button @click="mobileMenuOpen = false" class="p-2 rounded-lg hover:bg-brand-primary/10">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <div class="px-4 py-6 space-y-6">
            <nav class="flex flex-col space-y-4">
                {% for item in cms_nav_items %}
                    <a href="{{ item.url }}" class="text-base font-semibold uppercase tracking-wider hover:text-brand-primaryLight transition-colors">{{ item.name }}</a>
                {% empty %}
                    <a href="{% url 'homepage:about' %}" class="text-base font-semibold uppercase tracking-wider hover:text-brand-primaryLight transition-colors">About Us</a>
                    <a href="{% url 'rooms:room_list' %}" class="text-base font-semibold uppercase tracking-wider hover:text-brand-primaryLight transition-colors">Rooms & Suites</a>
                    <a href="{% url 'dining:dining_list' %}" class="text-base font-semibold uppercase tracking-wider hover:text-brand-primaryLight transition-colors">Dining</a>
                    <a href="{% url 'homepage:zipline' %}" class="text-base font-semibold uppercase tracking-wider hover:text-brand-primaryLight transition-colors">Zipline</a>
                    <a href="{% url 'homepage:sustainability' %}" class="text-base font-semibold uppercase tracking-wider hover:text-brand-primaryLight transition-colors">Sustainability</a>
                    <a href="{% url 'gallery:gallery_list' %}" class="text-base font-semibold uppercase tracking-wider hover:text-brand-primaryLight transition-colors">Gallery</a>
                    <a href="{% url 'contact:contact_page' %}" class="text-base font-semibold uppercase tracking-wider hover:text-brand-primaryLight transition-colors">Contact</a>
                {% endfor %}
            </nav>

            <div class="pt-6 border-t" :class="{ 'border-gray-200': currentTheme === 'light', 'border-brand-primary/20': currentTheme !== 'light' }">
                <label class="block text-xs font-semibold uppercase tracking-wider mb-2 opacity-80">Select Currency</label>
                <div class="relative">
                    <select @change="setCurrency($event.target.value)" 
                            class="w-full px-4 py-3 rounded-lg border text-sm font-semibold focus:outline-none appearance-none cursor-pointer"
                            :class="currentTheme === 'light' ? 'border-gray-300 text-gray-800 bg-white' : 'border-brand-primary/40 text-white bg-[#1A3A32]'">
                        {% for c in published_currencies %}
                            <option value="{{ c.iso_code }}" {% if c.iso_code == selected_currency %}selected{% endif %} :selected="currentCurrency === '{{ c.iso_code }}'">{{ c.name }} ({{ c.iso_code }})</option>
                        {% empty %}
                            <option value="USD" {% if selected_currency == 'USD' %}selected{% endif %} :selected="currentCurrency === 'USD'">US Dollar (USD)</option>
                        {% endfor %}
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-luxuryGold-500">
                        <i class="fa-solid fa-chevron-down text-[10px]"></i>
                    </div>
                </div>
            </div>

            <div class="pt-6">
                <a href="{% url 'rooms:room_list' %}" class="btn-gold-gradient block text-center w-full py-3 text-sm font-semibold uppercase tracking-wider rounded-lg text-white shadow-md">
                    Book A Stay
                </a>
            </div>
        </div>
    </div>
</div>
