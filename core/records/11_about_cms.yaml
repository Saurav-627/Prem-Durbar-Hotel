about_cms:
  hero_subtitle: Heritage & Mountain Hospitality
  hero_title: Our Story & Legacy
  hero_description: Nestled in Changunarayan-7, Nagarkot, Prem Durbar blends authentic Newari brick & wood craftsmanship with mountain tranquility, organic gastronomy, and high-altitude adventure.
  story_subtitle: Kathmandu Valley Artistry
  story_title: Traditional Newari Architecture Meets Mountain Luxury
  story_content: Prem Durbar was envisioned as a living tribute to Nepal's rich architectural heritage. Every brick, handcrafted stone masonry, and carved wooden window echoes centuries of Kathmandu valley royalty. Overlooking the peaceful Kamal Pokhari pond and pine forest ridge, our resort offers guests an immersive journey into Nepalese royal durbar elegance combined with modern five-star comfort.
  story_extra: Overlooking the peaceful Kamal Pokhari (Lotus Pond) and surrounded by Nagarkot’s lush pine forests, our resort offers guests a tranquil retreat from urban life while keeping you connected to organic nature and panoramic Himalayan vistas.
  badge1_title: Handcrafted Decor
  badge1_desc: Reclaimed wood beds & carved Newari window art.
  badge2_title: Himalayan Panorama
  badge2_desc: Unobstructed sunrise & sunset mountain views.
  video_url: https://www.youtube.com/embed/demo-zipline
  zipline_callout_title: Nagarkot Zipline — The Superman Zip Line
  zipline_callout_desc: Prem Durbar is proud home to Nepal’s longest, safest, and most thrill-inducing Superman Zipline. Soar through Nagarkot’s pine-clad hills with breathtaking views of Mount Everest and the Himalayan range.
  zipline_callout_link_text: Explore Zipline Flight
  team_subtitle: Dedicated Professionals
  team_title: Meet Our Hospitality & Adventure Team
  team_description: Our passionate team ensures your stay in Nagarkot is comfortable, memorable, and safe—from your luxury room to your zipline flight.

